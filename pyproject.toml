[project]
name = "redborder-tester"
version = "0.1.0"
description = "Comprehensive automated testing platform for Redborder Web UI and backend services"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
    "pytest-html>=4.1.1",
    "playwright>=1.42.0",
    "httpx>=0.27.0",
    "paramiko>=3.4.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "beautifulsoup4>=4.12.0",
    "allure-pytest>=2.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "web: Web UI browser-based end-to-end tests",
    "api: REST API and HTTP endpoint tests",
    "backend: Backend service and system integration tests",
    "smoke: Quick critical-path smoke tests",
    "alarms: Alarms and incidents end-to-end lifecycle tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
